spring:
  application:
    name: highschool-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/highschool_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    

server:
  port: 8082

jwt:
  signer-key: ${JWT_SIGNER_KEY:1234567890123456789012345678901234567890123456789012345678901234}
  issuer: ${JWT_ISSUER:highschool-management}
  valid-duration: ${JWT_VALID_DURATION:3600}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:7200}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:adminpassword}
  email: ${ADMIN_EMAIL:admin@example.com}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    org.springframework.security: DEBUG
